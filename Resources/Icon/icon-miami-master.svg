      <stop offset="0" stop-color="#140A33"/><stop offset="0.62" stop-color="#2A0F4A"/><stop offset="1" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="bSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/><stop offset="0.55" stop-color="#FF6A5E"/><stop offset="1" stop-color="#FF3EA5"/>
    </linearGradient>
    <clipPath id="body"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <g transform="translate(100 100) scale(0.919643) translate(-64 -64)">
