name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! The more details, the faster it can be fixed.
        *Report a problem* in Lumerist (the menu bar or notification area menu, or General → About & Support) fills in the version, system, computer and keyboard for you.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a photo in Develop
        2. Hold Q and turn the mouse wheel or swipe on the trackpad
        3. …
    validations:
      required: true
  - type: input
    id: lumerist
    attributes:
      label: Lumerist version
      description: Shown in the app (General → About & Support) and in Lightroom's Plug-in Manager.
      placeholder: "0.9.2"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS or Windows version
      placeholder: "macOS 15.4 (24E248), Windows 11 24H2 (build 26100)"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer
      placeholder: "Mac with Apple Silicon, Mac with Intel, Windows PC (x64), Windows PC (Arm)"
    validations:
      required: true
  - type: input
    id: lightroom
    attributes:
      label: Lightroom Classic version and language
      placeholder: "16.0, Italian"
    validations:
      required: true
  - type: input
    id: keyboard
    attributes:
      label: Keyboard layout
      placeholder: "US, Italian, German (QWERTZ), French (AZERTY)…"
  - type: input
    id: mouse
    attributes:
      label: Mouse or trackpad
      placeholder: "Magic Mouse, Logitech MX Master with Logi Options+, trackpad…"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Turn on the debug log in Lumerist → General, reproduce the problem, then attach both logs:
        on the Mac `~/Library/Logs/Lumerist/Lumerist.log` and
        `~/Library/Logs/Adobe/Lightroom/LrClassicLogs/Lumerist.log`;
        on Windows `%LOCALAPPDATA%\Lumerist\Logs\Lumerist.log` and
        `%LOCALAPPDATA%\Adobe\Lightroom\Logs\LrClassicLogs\Lumerist.log`.
      render: text
