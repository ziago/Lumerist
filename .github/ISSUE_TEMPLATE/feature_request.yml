name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the editing task or workflow that is slow or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Lumerist help?
      description: Keys, gestures, panels… anything goes.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Sketches or examples are welcome — please use only your own images.
